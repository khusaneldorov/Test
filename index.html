<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Поиск филиалов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --beige: #f5f0eb;
    --beige-deep: #eae1d4;
    --card: rgba(255,255,255,0.55);
    --card-border: rgba(43,36,29,0.08);
    --orange: #ff6b2b;
    --orange-soft: rgba(255,107,43,0.16);
    --orange-deep: #e0551c;
    --ink: #2b241d;
    --ink-soft: #786d61;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    min-height:100vh;
    font-family:'Manrope', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(ellipse 700px 500px at 15% -5%, rgba(255,107,43,0.16), transparent 60%),
      radial-gradient(ellipse 600px 500px at 105% 10%, rgba(255,107,43,0.10), transparent 60%),
      linear-gradient(180deg, var(--beige), var(--beige-deep));
    display:flex;
    justify-content:center;
    padding: 64px 20px 80px;
  }

  .wrap{ width:100%; max-width: 620px; }

  .eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--orange-deep);
    font-weight:700;
    text-align:center;
    margin-bottom:10px;
    opacity:0;
    animation: rise .6s ease forwards;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: clamp(28px, 5vw, 40px);
    text-align:center;
    letter-spacing:-0.01em;
    margin-bottom:8px;
    opacity:0;
    animation: rise .6s ease .05s forwards;
  }

  .sub{
    text-align:center;
    color:var(--ink-soft);
    font-size:14.5px;
    margin-bottom:34px;
    opacity:0;
    animation: rise .6s ease .1s forwards;
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .search-box{
    position:relative;
    opacity:0;
    animation: rise .6s ease .15s forwards;
  }

  .search-box input{
    width:100%;
    padding: 18px 52px 18px 22px;
    font-family:'Manrope', sans-serif;
    font-size:16px;
    font-weight:500;
    color:var(--ink);
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    outline:none;
    box-shadow: 0 8px 24px rgba(43,36,29,0.05);
    transition: box-shadow .25s ease, border-color .25s ease;
  }

  .search-box input:focus{
    border-color: rgba(255,107,43,0.4);
    box-shadow: 0 8px 28px rgba(255,107,43,0.16), 0 0 0 4px var(--orange-soft);
  }

  .search-box svg{
    position:absolute;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    width:19px; height:19px;
    stroke: var(--ink-soft);
    pointer-events:none;
  }

  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin: 18px 4px 6px;
    font-size:12.5px;
    color: var(--ink-soft);
  }

  .meta-row span b{ color:var(--orange-deep); font-weight:700; }

  .results{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }

  .card{
    background: var(--card);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 16px 20px;
    cursor:pointer;
    animation: cardIn .4s ease both;
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }

  .card:hover{
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(43,36,29,0.07);
    border-color: rgba(255,107,43,0.25);
  }

  @keyframes cardIn{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }

  .card-name{ font-weight:700; font-size:15.5px; }
  .card-district{
    font-size:12px;
    color: var(--orange-deep);
    background: var(--orange-soft);
    padding: 3px 10px;
    border-radius: 100px;
    white-space:nowrap;
    font-weight:600;
  }

  .card-address{ font-size:13.5px; color:var(--ink-soft); margin-top:6px; }

  .card-details{
    max-height:0;
    overflow:hidden;
    transition: max-height .35s ease, margin-top .35s ease;
  }

  .card.open .card-details{ max-height:120px; margin-top:14px; }

  .detail-line{
    display:flex;
    gap:10px;
    font-size:13.5px;
    padding: 6px 0;
    border-top: 1px solid var(--card-border);
  }

  .detail-line:first-child{ border-top:none; padding-top:0; }
  .detail-label{ color:var(--ink-soft); min-width:78px; }
  .detail-value{ font-weight:600; }

  .card.open .card-name{ color: var(--orange-deep); }

  mark{
    background: var(--orange-soft);
    color: var(--orange-deep);
    padding: 0 2px;
    border-radius: 4px;
    font-weight:700;
    animation: markIn .3s ease;
  }

  @keyframes markIn{
    from{ background: rgba(255,107,43,0.55); }
    to{ background: var(--orange-soft); }
  }

  .empty{
    text-align:center;
    padding: 40px 10px;
    color:var(--ink-soft);
    font-size:14px;
  }

  .status{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:28px;
    opacity:.7;
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="eyebrow">Поиск филиалов</div>
    <h1>Где находится ближайшая точка?</h1>
    <p class="sub">Начните вводить название, район или адрес — список сузится сам</p>

    <div class="search-box">
      <input id="searchInput" type="text" placeholder="Например: Чиланзар, Абдуллаева, аптека..." autocomplete="off">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </div>

    <div class="meta-row">
      <span>Найдено: <b id="countNum">0</b></span>
      <span id="sourceLabel">источник: демо-данные</span>
    </div>

    <div class="results" id="results"></div>
    <div class="empty" id="emptyState" style="display:none;">Ничего не найдено — попробуйте другой запрос</div>

    <p class="status" id="statusLine">Загрузка данных...</p>
  </div>

<script>
/* ====================================================================
   НАСТРОЙКА: вставь сюда URL своего Apps Script Web App после деплоя.
   Пока пусто — работает на демо-данных ниже, чтобы можно было
   сразу смотреть, как всё выглядит.
   ==================================================================== */
const APPS_SCRIPT_URL = ""; // например: "https://script.google.com/macros/s/AKfycb.../exec"

// демо-данные — такой же формат должен возвращать твой Google Sheet
const DEMO_DATA = [
  { "Филиал": "Аптека №1", "Район": "Чиланзарский", "Адрес": "ул. Бунёдкор, 12", "Телефон": "+998 71 200 10 01", "Менеджер": "Дилноза Каримова" },
  { "Филиал": "Аптека №2", "Район": "Юнусабадский", "Адрес": "ул. Амира Темура, 45", "Телефон": "+998 71 200 10 02", "Менеджер": "Азиз Абдуллаев" },
  { "Филиал": "Аптека №3", "Район": "Мирзо-Улугбекский", "Адрес": "ул. Афросиаб, 3", "Телефон": "+998 71 200 10 03", "Менеджер": "Шахноза Юсупова" },
  { "Филиал": "Аптека №4", "Район": "Мирабадский", "Адрес": "ул. Шахрисабз, 21", "Телефон": "+998 71 200 10 04", "Менеджер": "Бахтиёр Раззаков" },
  { "Филиал": "Аптека №5", "Район": "Шайхантаурский", "Адрес": "ул. Навои, 88", "Телефон": "+998 71 200 10 05", "Менеджер": "Мадина Эргашева" },
  { "Филиал": "Аптека №6", "Район": "Яккасарайский", "Адрес": "ул. Пушкина, 7", "Телефон": "+998 71 200 10 06", "Менеджер": "Сардор Тошматов" }
];

let ALL_DATA = [];

async function loadData(){
  const statusLine = document.getElementById('statusLine');
  const sourceLabel = document.getElementById('sourceLabel');

  if(!APPS_SCRIPT_URL){
    ALL_DATA = DEMO_DATA;
    statusLine.textContent = "Демо-режим — подключи APPS_SCRIPT_URL для реальных данных";
    render("");
    return;
  }

  try{
    statusLine.textContent = "Загрузка из Google Sheets...";
    const res = await fetch(APPS_SCRIPT_URL);
    if(!res.ok) throw new Error("Bad response");
    ALL_DATA = await res.json();
    sourceLabel.textContent = "источник: Google Sheets";
    statusLine.textContent = "Данные обновлены";
  }catch(err){
    console.warn("Не удалось получить данные из Apps Script, показываю демо:", err);
    ALL_DATA = DEMO_DATA;
    statusLine.textContent = "Не удалось загрузить таблицу — показаны демо-данные";
  }
  render("");
}

function highlight(text, query){
  if(!query) return text;
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if(idx === -1) return text;
  return text.slice(0, idx) + "<mark>" + text.slice(idx, idx+query.length) + "</mark>" + text.slice(idx+query.length);
}

function matches(item, query){
  const q = query.toLowerCase();
  return (item["Филиал"]||"").toLowerCase().includes(q)
      || (item["Район"]||"").toLowerCase().includes(q)
      || (item["Адрес"]||"").toLowerCase().includes(q);
}

function render(query){
  const results = document.getElementById('results');
  const empty = document.getElementById('emptyState');
  const countNum = document.getElementById('countNum');

  const list = query ? ALL_DATA.filter(item => matches(item, query)) : ALL_DATA;
  countNum.textContent = list.length;

  results.innerHTML = "";
  empty.style.display = list.length ? "none" : "block";

  list.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = "card";
    card.style.animationDelay = (i * 0.04) + "s";
    card.innerHTML = `
      <div class="card-top">
        <div class="card-name">${highlight(item["Филиал"]||"", query)}</div>
        <div class="card-district">${highlight(item["Район"]||"", query)}</div>
      </div>
      <div class="card-address">${highlight(item["Адрес"]||"", query)}</div>
      <div class="card-details">
        <div class="detail-line"><span class="detail-label">Адрес</span><span class="detail-value">${item["Адрес"]||""}</span></div>
        <div class="detail-line"><span class="detail-label">Телефон</span><span class="detail-value">${item["Телефон"]||""}</span></div>
        <div class="detail-line"><span class="detail-label">Менеджер</span><span class="detail-value">${item["Менеджер"]||""}</span></div>
      </div>
    `;
    card.addEventListener('click', () => {
      const wasOpen = card.classList.contains('open');
      document.querySelectorAll('.card.open').forEach(c => c.classList.remove('open'));
      if(!wasOpen) card.classList.add('open');
    });
    results.appendChild(card);
  });
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  render(e.target.value.trim());
});

loadData();
</script>
</body>
</html>
